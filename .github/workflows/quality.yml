# SPDX-License-Identifier: MIT OR Apache-2.0

name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    # Pinned so a runner image upgrade is a deliberate change, not a silent one.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify unprivileged execution
        run: test "$(id -u)" -ne 0

      - name: Install the system SQLite development files
        # ADR-020: rusqlite links the distribution SQLite, never a bundled copy.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libsqlite3-dev pkg-config
          pkg-config --modversion sqlite3

      - name: Install pinned Rust toolchain
        # Without a name, rustup installs the toolchain from rust-toolchain.toml.
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.19.0 --locked

      - name: Install cargo-nextest
        # The gate runs the tests through nextest when it is present.
        run: cargo install cargo-nextest --version 0.9.149 --locked

      - name: Run quality gate
        shell: pwsh
        run: ./scripts/quality.ps1
