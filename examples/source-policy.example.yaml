# Illustrative example only: NOT an active schema and NOT a ready-to-use configuration file.
source:
  forge: github
  canonical_url: https://github.com/matthart1983/netwatch
  repository_id: '<numeric ID returned and verified via API>'
  owner_id: '<verified owner ID>'
  state: observing  # not enabled in APT/DNF until confirmed
families:
  - name: netwatch
    packages:
      deb: [netwatch]
      rpm: [netwatch]
policy:
  modes: [strict, attested]
  selected_channel: stable
  source_preference: supplemental
  discover_other_repositories: false
  auto_fetch_foreign_system_dependencies: false
