# SPDX-License-Identifier: MIT OR Apache-2.0
#
# P3-001 research tool: publishes DEB files as one signed APT generation
# through the production index publisher (publish_apt). Research tooling
# only; the production caller is the state owner. Built by
# research/p3-001/build.sh.

[package]
name = "pakomichi-p3001-publish"
version = "0.0.0"
edition = "2024"
rust-version = "1.94.1"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "p3001-publish"
path = "src/main.rs"

[workspace]
resolver = "3"

[dependencies]
pakomichi = { path = "../../.." }

[profile.release]
debug = false
strip = true

[lints.rust]
unsafe_code = "deny"
