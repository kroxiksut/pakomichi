# SPDX-License-Identifier: MIT OR Apache-2.0
#
# P3-002 research tool: drives the production APT adapter (render, plan,
# apply, read back) on a disposable target. Research tooling only; the
# production caller is the privileged applier (P4-003). Built by
# research/p3-002/build.sh.

[package]
name = "pakomichi-p3002-apt"
version = "0.0.0"
edition = "2024"
rust-version = "1.94.1"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "p3002-apt"
path = "src/main.rs"

[workspace]
resolver = "3"

[dependencies]
pakomichi = { path = "../../.." }

[profile.release]
debug = false
strip = true

[lints.rust]
unsafe_code = "deny"
