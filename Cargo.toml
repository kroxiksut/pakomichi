[workspace]
members = ["."]
exclude = ["prototypes/p0-004"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.94.1"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
unwrap_used = "deny"
expect_used = "warn"
todo = "warn"
unimplemented = "warn"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = { version = "=0.10.9", default-features = false }
libc = { version = "=0.2.191", default-features = false }
# ADR-017: RPM header inspection only. Default features stay off: no payload,
# no decompression (so no flate2/zlib-rs), no signature crates.
rpm = { version = "=0.30.2", default-features = false }
# ADR-017: Tokio only for the long-lived network process (GitHub I/O here).
tokio = { version = "=1.53.3", default-features = false, features = ["net", "rt", "time"] }
# P2-001 HTTP stack (docs/en/architecture/overview.md, "HTTP and TLS
# stack"): one HTTP/1.1 connection per request, no pool, no automatic
# redirects, no proxy, no decompression.
hyper = { version = "=1.12.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
http-body-util = { version = "=0.1.5", default-features = false }
# TLS for the API client: rustls with the `ring` provider (no aws-lc-rs, so
# no OpenSSL-licensed C code and no CMake/NASM), TLS 1.2 and 1.3, no
# logging, and the operating system CA store (no bundled root list).
# `ring`, `rustls-webpki`, `untrusted`, and `subtle` need the per-crate
# license exceptions in deny.toml.
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = { version = "=0.8.5", default-features = false }
# ADR-017 point 2, ADR-020: the distribution SQLite library (no `bundled`),
# default features off; `backup` for the online backup API. Unix only: the
# Windows development host has no system SQLite to link against.
rusqlite = { version = "=0.40.2", default-features = false, features = ["backup"] }
# ADR-029: SO_PEERCRED on local IPC sockets. std::os::unix::net::UnixStream::peer_cred
# is still unstable (peer_credentials_unix_socket), and the workspace denies
# unsafe code. Unix only, default features off, only `socket`.
nix = { version = "=0.31.3", default-features = false, features = ["socket"] }
# TEST ONLY: generates throwaway certificates for the loopback TLS tests.
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring"] }

[package]
name = "pakomichi"
version = "0.0.0"
description = "A package bridge from Git releases to native package managers"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
rpm.workspace = true
tokio.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
rustls-native-certs.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
rusqlite.workspace = true
nix.workspace = true

# TEST ONLY: the RPM builder writes uncompressed fixtures at test time; the
# production reader never enables `payload` or a compression feature.
[dev-dependencies]
rpm = { workspace = true, features = ["payload"] }
tokio = { workspace = true, features = ["io-util", "macros"] }
rcgen.workspace = true

[lib]
path = "src/lib.rs"

[lints]
workspace = true
