# SPDX-License-Identifier: MIT OR Apache-2.0

[workspace]
members = ["."]
exclude = ["prototypes/p0-004"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.94.1"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
unwrap_used = "deny"
expect_used = "warn"
todo = "warn"
unimplemented = "warn"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[package]
name = "pakomichi"
version = "0.0.0"
description = "A package bridge from Git releases to native package managers"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true

[lib]
path = "src/lib.rs"

[lints]
workspace = true
