  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#DFEBDC"/><stop offset=".58" stop-color="#F4E8C8"/><stop offset="1" stop-color="#F6DEC2"/></linearGradient>
  <linearGradient id="grass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#B7C79E"/><stop offset="1" stop-color="#6F9A79"/></linearGradient>
